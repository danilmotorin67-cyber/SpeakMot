name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2 libegl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
          pip install pytest ruff numpy sounddevice PySide6==6.8.1

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1
          pip install --upgrade pyinstaller-hooks-contrib

      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --windowed --name SpeakMotor
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          --collect-submodules av
          --hidden-import av._core
          --collect-all huggingface_hub
          main.py

      - name: Check bundled imports
        run: |
          $report = "$PWD\selftest.txt"
          $process = Start-Process -FilePath dist/SpeakMotor/SpeakMotor.exe `
            -ArgumentList "--selftest", $report -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) {
            Write-Error "Собранное приложение не смогло импортировать зависимости"
            exit 1
          }

      - name: Smoke test
        run: |
          $process = Start-Process -FilePath dist/SpeakMotor/SpeakMotor.exe -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) {
            Write-Error "SpeakMotor.exe завершился сразу, код $($process.ExitCode)"
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Приложение запустилось и работает"

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package portable build
        run: Compress-Archive -Path dist/SpeakMotor/* -DestinationPath SpeakMotor-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakMotor-windows
          path: |
            SpeakMotor-windows.zip
            installer/*.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpeakMotor-windows.zip
            installer/*.exe
