name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --windowed --name SpeakMot
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tokenizers
          --collect-all av
          main.py

      - name: Smoke test
        run: |
          $process = Start-Process -FilePath dist/SpeakMot/SpeakMot.exe -PassThru
          Start-Sleep -Seconds 25
          if ($process.HasExited) {
            Write-Error "SpeakMot.exe завершился сразу, код $($process.ExitCode)"
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Приложение запустилось и работает"

      - name: Package
        run: Compress-Archive -Path dist/SpeakMot/* -DestinationPath SpeakMot-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakMot-windows
          path: SpeakMot-windows.zip
          retention-days: 30
